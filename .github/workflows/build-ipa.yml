name: Build IPA (TrollStore / 未签名)

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build-ipa:
    runs-on: macos-14
    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 显示文件结构
        run: |
          pwd
          ls -la

      - name: 定位工程目录（兼容嵌套/平铺两种上传结构）
        run: |
          if [ -d MiSound-iOS ]; then
            cd MiSound-iOS
          fi
          echo "project_dir=$(pwd)" >> $GITHUB_ENV

      - name: 编译（关闭签名）
        run: |
          xcodebuild \
            -project MiSound.xcodeproj \
            -target MiSound \
            -configuration Release \
            -sdk iphoneos \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            -derivedDataPath build \
            build
        working-directory: ${{ env.project_dir }}

      - name: 打 IPA 包
        run: |
          mkdir -p Payload
          cp -R build/Build/Products/Release-iphoneos/MiSound.app Payload/
          ditto -c -k --keepParent Payload MiSound-TrollStore.ipa
          ls -la MiSound-TrollStore.ipa
        working-directory: ${{ env.project_dir }}

      - name: 上传 IPA 产物
        uses: actions/upload-artifact@v4
        with:
          name: MiSound-TrollStore-ipa
          path: MiSound-TrollStore.ipa
          if-no-files-found: error
          working-directory: ${{ env.project_dir }}
