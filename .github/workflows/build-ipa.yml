name: Build IPA (TrollStore / 未签名)

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build-ipa:
    runs-on: macos-14
    steps:
      - name: 检出代码
        uses: actions/checkout@v4
      - name: 编译（关闭签名）
        run: |
          xcodebuild \
            -project MiSound.xcodeproj \
            -target MiSound \
            -configuration Release \
            -sdk iphoneos \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            -derivedDataPath build \
            build
      - name: 打 IPA 包
        run: |
          mkdir -p Payload
          cp -R build/Build/Products/Release-iphoneos/MiSound.app Payload/
          ditto -c -k --keepParent Payload MiSound-TrollStore.ipa
          ls -la MiSound-TrollStore.ipa
      - name: 上传 IPA 产物
        uses: actions/upload-artifact@v4
        with:
          name: MiSound-TrollStore-ipa
          path: MiSound-TrollStore.ipa
          if-no-files-found: error
